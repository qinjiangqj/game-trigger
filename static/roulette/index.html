<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER ROULETTE · 赛博轮盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Oxanium:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div id="edge-glow" aria-hidden="true"></div>
<div id="fly-layer" aria-hidden="true"></div>

<header class="marquee">
    <div class="marquee-est">★ EST. 2077 — HOUSE OF NEON ★</div>
    <h1 class="neon-title">CYBER ROULETTE</h1>
    <div class="marquee-sub">— 赛 博 轮 盘 · 永 夜 赌 局 —</div>
</header>

<main class="table-grid">

    <!-- 左：转盘 -->
    <section class="wheel-side">
        <div class="wheel-stage">
            <div class="wheel-scale">
                <div class="wheel-tilt" id="wheelTilt">
                    <div class="rim">
                        <div class="bulbs" id="bulbs"></div>
                    </div>
                    <div class="ball-track"></div>
                    <div class="wheel" id="wheel">
                        <div class="conic" id="conicFace"></div>
                        <div class="separators" id="seps"></div>
                        <div class="labels" id="labels"></div>
                        <div class="hub"><div class="hub-spin"></div></div>
                        <div class="win-pulse" id="winPulse" hidden></div>
                    </div>
                    <div class="ball" id="ball" hidden></div>
                </div>
            </div>
            <div class="wheel-readout">
                <div class="led-panel">
                    <span class="led-label">LAST</span>
                    <span class="led-num" id="ledNum">--</span>
                    <span class="led-color" id="ledColor">STANDBY</span>
                </div>
                <div class="history" id="history"></div>
            </div>
        </div>
        <div class="wheel-caption">EUROPEAN · SINGLE ZERO · 37 POCKETS · RTP 97.3%</div>
    </section>

    <!-- 右：下注表 -->
    <section class="bet-side">
        <div class="panel bet-panel">
            <i class="corner tl"></i><i class="corner tr"></i>
            <i class="corner bl"></i><i class="corner br"></i>

            <h2 class="panel-title">PLACE YOUR BETS</h2>

            <div class="layout-wrap">
                <div class="layout" id="layout"></div>
            </div>

            <div class="chip-rack">
                <div class="rack-row">
                    <span class="rack-title">CHIPS</span>
                    <div class="chips" id="chips"></div>
                    <div class="balance">
                        <span class="led-label">BALANCE</span>
                        <b id="balance">1,000</b>
                    </div>
                </div>
                <div class="rack-hint">选筹码 → 点击台面投注 · 中奖返还即时入账</div>
            </div>

            <div class="actions">
                <button id="btnSpin" class="btn-spin">SPIN ⟳</button>
                <button id="btnClear" class="btn-ghost">清空</button>
                <button id="btnRebet" class="btn-ghost">重复上局</button>
                <button id="btnMute" class="btn-ghost" aria-label="音效开关">🔊</button>
            </div>

            <div class="status-bar" id="statusBar">RNG: LOCAL-CSPRNG · AWAITING BETS…</div>
        </div>
    </section>
</main>

<footer class="site-foot">
    <span>DEMO ONLY — 前端演示 · 不涉及真实投注</span>
    <a href="/">← 返回主页</a>
</footer>

<div id="toast" class="toast"></div>

<script src="roulette.js"></script>
</body>
</html>
